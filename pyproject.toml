[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workplace-mapping"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wm = "wm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
wm = ["templates/**/*", "templates/**/.*", "templates/**/.*/**/*"]
